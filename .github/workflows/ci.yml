name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, because the iOS targets cannot be compiled anywhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test every target
        run: ./gradlew build --stacktrace

      # `build` stops at the klib, so link the sample's framework too: it is the step that would
      # catch an iOS-only break in the API the sample uses.
      - name: Link the sample's iOS framework
        run: ./gradlew :sample:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build the API docs
        run: ./gradlew dokkaGenerate --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
